<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USCCB to ProPresenter</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f9; color: #333; display: flex;
            justify-content: center; align-items: center; height: 100vh; margin: 0;
        }
        .card {
            background: #fff; padding: 2.5rem; border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; max-width: 480px; width: 90%;
        }
        button {
            background-color: #0066cc; color: white; padding: 0.8rem 1.6rem;
            font-size: 1rem; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;
        }
        button:hover { background-color: #004bb3; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        #status { margin-top: 1rem; font-size: 0.9rem; color: #666; word-break: break-word; }
    </style>
</head>
<body>
    <div class="card">
        <h1>USCCB to ProPresenter</h1>
        <p>Click below to fetch today's Catholic Daily Readings via official USCCB RSS and create your slide file.</p>
        <button id="fetchBtn" onclick="generateFile()">Download ProPresenter File</button>
        <div id="status"></div>
    </div>

    <script>
        async function generateFile() {
            const status = document.getElementById('status');
            const btn = document.getElementById('fetchBtn');
            status.innerText = "Fetching readings from RSS...";
            status.style.color = "#666";
            btn.disabled = true;

            // RSS endpoint converted to JSON via rss2json API
            const rssUrl = "https://bible.usccb.org/readings/daily-readings.rss";
            const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;

            try {
                const res = await fetch(apiUrl);
                if (!res.ok) throw new Error("Could not connect to RSS provider.");
                
                const data = await res.json();
                if (data.status !== 'ok' || !data.items || data.items.length === 0) {
                    throw new Error("No reading items found in RSS feed.");
                }

                let lines = [];
                const feedTitle = data.feed.title || "USCCB Daily Readings";
                lines.push(`--- ${feedTitle} ---`);

                data.items.forEach(item => {
                    if (item.title) {
                        lines.push(`\n[${item.title.trim()}]`);
                    }

                    // Parse the HTML content inside the RSS item description
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(item.content || item.description, 'text/html');
                    
                    const paragraphs = doc.querySelectorAll('p, div');
                    if (paragraphs.length > 0) {
                        paragraphs.forEach(p => {
                            const txt = p.textContent.replace(/\s+/g, ' ').trim();
                            if (txt.length > 15 && !txt.toLowerCase().includes('copyright')) {
                                lines.push(txt);
                            }
                        });
                    } else {
                        // Fallback to text content if no paragraph tags
                        const txt = doc.body.textContent.replace(/\s+/g, ' ').trim();
                        if (txt.length > 15) lines.push(txt);
                    }
                });

                const outputText = lines.join('\n\n');
                
                // Trigger file download
                const blob = new Blob([outputText], { type: 'text/plain;charset=utf-8' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `USCCB_Daily_Readings_${new Date().toISOString().slice(0,10)}.txt`;
                a.click();

                status.innerText = "Downloaded successfully!";
                status.style.color = "green";
            } catch (err) {
                console.error(err);
                status.innerText = `Error: ${err.message}`;
                status.style.color = "red";
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
