<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USCCB Daily Readings for ProPresenter</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #1a252c; }
        p { color: #666; font-size: 0.95rem; line-height: 1.5; margin-bottom: 2rem; }
        .btn {
            display: inline-block;
            background-color: #0066cc;
            color: white;
            padding: 0.8rem 1.6rem;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
            transition: background 0.2s ease-in-out;
        }
        .btn:hover { background-color: #004bb3; }
    </style>
</head>
<body>
    <div class="card">
        <h1>USCCB to ProPresenter</h1>
        <p>Pull today's Catholic Daily Readings directly from USCCB and generate an instant slide-ready file.</p>
        <a href="/download" class="btn">Download ProPresenter File (.txt)</a>
    </div>
</body>
</html>
