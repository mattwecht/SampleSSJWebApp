<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USCCB to ProPresenter</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 420px;
            width: 90%;
        }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #1a252c; }
        p { color: #666; font-size: 0.95rem; line-height: 1.5; margin-bottom: 1.5rem; }
        input[type="date"] {
            padding: 0.7rem;
            font-size: 1rem;
            margin-bottom: 1.5rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            background-color: #0066cc;
            color: white;
            padding: 0.8rem 1.6rem;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: background 0.2s ease-in-out;
        }
        button:hover { background-color: #004bb3; }
    </style>
</head>
<body>
    <div class="card">
        <h1>USCCB to ProPresenter</h1>
        <p>Select a date to generate today's or upcoming Catholic Daily Readings for ProPresenter.</p>
        
        <form action="/download" method="POST">
            <input type="date" id="date_input" name="date_input" required>
            <button type="submit">Download .txt File</button>
        </form>
    </div>

    <script>
        // Set date input to today by default
        document.getElementById('date_input').value = new Date().toISOString().split('T')[0];
    </script>
</body>
</html>
